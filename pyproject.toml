[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scan2stage"
version = "0.3.0"
description = "Local structural-first 3D scan to practical-shooting stage pipeline"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy>=1.24",
  "open3d>=0.19,<0.20",
  "pydantic>=2.6",
  "matplotlib>=3.8",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
scan2stage = "scan2stage.cli:main"
scan2stage-web = "scan2stage.web:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scan2stage = [
  "webui/templates/*.html",
  "webui/static/*.css",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
